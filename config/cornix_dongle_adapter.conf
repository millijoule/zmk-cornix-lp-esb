# USB-connected split central. BLE, display, Studio and battery features
# are explicitly disabled for the first ESB-only validation.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_POINTING=n

# Two ESB peripherals: left ID 0 and right ID 1.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=54
